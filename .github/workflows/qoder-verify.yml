name: Qoder verify (temporary)

on:
  push:
    branches:
      - sync/upstream-main-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: SQLite wiki source-ref tests
        env:
          CGO_ENABLED: "1"
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
        run: |
          go test -tags sqlite_fts5 -count=1 -v ./internal/application/repository \
            -run 'Test(ListBySourceRef_SQLite|ListSummariesByKnowledgeIDs_SQLite)'
      - name: Types package (jieba embed)
        env:
          CGO_ENABLED: "1"
        run: go test -tags sqlite_fts5 -count=1 ./internal/types
      - name: Capture test failure
        if: failure()
        env:
          CGO_ENABLED: "1"
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
        run: |
          set +e
          go test -tags sqlite_fts5 -count=1 -v ./internal/application/repository \
            -run 'Test(ListBySourceRef_SQLite|ListSummariesByKnowledgeIDs_SQLite)' \
            > /tmp/source-ref.log 2>&1
          cp /tmp/source-ref.log ci-source-ref-failure.log
          {
            echo '## Source-ref test failure'
            echo '```'
            tail -200 /tmp/source-ref.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ci-source-ref-failure.log
          git commit -m 'ci: capture source-ref failure [skip ci]'
          git push origin HEAD:refs/heads/sync/upstream-main-20261118

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci --prefer-offline
          npm run build
