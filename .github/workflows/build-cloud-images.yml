# Build the WeKnora app + ui images for the Tencent Cloud box (linux/amd64 only)
# and publish them as release assets: the box downloads them via ghfast.top and
# runs `docker load`. No registry and no Docker Hub credentials are involved.
#
# Canonical copy: <fork>/.github/workflows/build-cloud-images.yml
# Reference copy on the box: /root/weknoraOPS/workflows/build-cloud-images.yml
#
# A push-triggered run has an empty `inputs` context, so every input is
# repeated inline as `inputs.X || '<default>'`; keep the two in sync.
#
# ON THIS BRANCH the defaults deliberately point at the fork and at
# feature/knowledge-folders, and the `||` fallbacks resolve to the repository and
# commit that triggered the run instead of a pinned upstream sha. That is what
# lets a push to this branch build and test exactly what was pushed. main's copy
# still pins Tencent/WeKnora@1fa915d; do not "resync" this back without wanting
# to, and revert these three defaults before this branch is ever merged.
name: Build cloud images (release assets)

on:
  # Editing this file re-runs the build, so iterating needs no UI click.
  push:
    paths:
      - ".github/workflows/build-cloud-images.yml"
      - "internal/**"
      - "migrations/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
    branches:
      - main
      # The knowledge-folders branch carries this file too, so editing it there
      # starts a run without anyone clicking anything.
      - feature/knowledge-folders
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository to build (owner/name)"
        required: true
        default: "sunqiangvancl/WeKnora"
      source_ref:
        description: "Commit sha, branch or tag to build"
        required: true
        default: "feature/knowledge-folders"
      release_tag:
        description: "Release tag that holds the image tarballs"
        required: true
        default: "cloud-images"
      with_anydoc:
        description: "WITH_ANYDOC for the app image (1=on, 0=off)"
        required: true
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || 'cloud-images' }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --repo "${{ github.repository }}" --latest=false \
              --title "Cloud images" \
              --notes "Prebuilt linux/amd64 images for the Tencent Cloud box, installed with docker load. Built from ${{ inputs.source_repo || github.repository }} by the Build cloud images workflow."
          fi
          echo "release: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  test:
    # Gate for both artifacts. Nothing has been compiled from this branch on the
    # cloud box (its Go is 1.25.8 against a go.mod that requires 1.26.0, and it
    # has no node/npm at all), so this job is the first real compile of the
    # patch and, since the frontend step below, also the only executor of the
    # ui unit tests and i18n key parity. Commands mirror .github/workflows/app.yml
    # rather than inventing a second definition of "does the app build".
    name: compile + folder tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout ${{ inputs.source_repo || github.repository }}@${{ inputs.source_ref || github.sha }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compile everything the app image contains
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')
          go vet "${pkgs[@]}"
          go build ./cmd/server

      # Frontend tests never ran anywhere: the build box has no node/npm, and the
      # ui job only does `npm run build` inside Docker (syntax gate, not assertions).
      # This round rewrites the browse/search contract in folderTree.test.ts and adds
      # i18n keys, so without this step those edits are unverified.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend unit tests and i18n key parity
        working-directory: frontend
        run: |
          # pipefail: without it `npm test | tee` would let a red suite sail on
          set -o pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee /tmp/fe-test.log
          # A green run that discovered zero tests is worse than no step at all:
          # it reads as verification. Fail loudly instead.
          grep -qE '^# (pass|tests) [1-9]' /tmp/fe-test.log || {
            echo "FATAL: frontend test run reported no tests — node's default glob is not"
            echo "       matching .ts under tsx. Switch to the explicit list below."
            exit 1; }
          npm run check-i18n

      - name: Folder unit tests
        shell: bash
        run: |
          go test -count=1 ./internal/types/ -run 'Folder|Runtime'
          go test -count=1 ./internal/application/service/ -run 'Folder'
          go test -count=1 ./internal/handler/ -run 'Folder|Runtime'

      - name: Run migration 000900 up and down on real PostgreSQL
        # The migration is the only irreversible part of this patch, and it has
        # never been executed anywhere. up -> verify -> down -> up also proves the
        # IF NOT EXISTS guards make a retry safe.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: |
          psql -v ON_ERROR_STOP=1 -f migrations/versioned/000900_knowledge_folders.up.sql
          psql -v ON_ERROR_STOP=1 -c "\d knowledge_folders" | grep -q path
          psql -v ON_ERROR_STOP=1 -f migrations/versioned/000900_knowledge_folders.down.sql
          psql -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.knowledge_folders') IS NULL" | grep -qx t
          psql -v ON_ERROR_STOP=1 -f migrations/versioned/000900_knowledge_folders.up.sql
          psql -v ON_ERROR_STOP=1 -f migrations/versioned/000900_knowledge_folders.up.sql

      - name: Folder endpoints are registered for API keys
        # An unregistered route is refused by the API-key gate by default, which
        # is how GET /skills/catalog ended up JWT-only. This asserts ours are in.
        shell: bash
        run: |
          go test -count=1 ./internal/router/ -run 'ApiKey|Capability'

  app:
    name: app image (linux/amd64)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ${{ inputs.source_repo || github.repository }}@${{ inputs.source_ref || github.sha }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve version info
        id: v
        run: |
          set -euo pipefail
          full="$(git rev-parse HEAD)"
          short="${full:0:7}"
          version="$(cat VERSION 2>/dev/null | tr -d '\n\r' || true)"
          [ -n "$version" ] || version="unknown"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "resolved: $full (short $short, version $version)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64
          push: false
          load: true
          tags: wechatopenai/weknora-app:cloud-${{ steps.v.outputs.short }}
          build-args: |
            VERSION_ARG=${{ steps.v.outputs.version }}
            COMMIT_ID_ARG=${{ steps.v.outputs.short }}
            BUILD_TIME_ARG=${{ steps.v.outputs.build_time }}
            GO_VERSION_ARG=go1.26-bookworm
            WITH_ANYDOC=${{ inputs.with_anydoc || '1' }}
          cache-from: type=gha,scope=cloud-app
          cache-to: type=gha,scope=cloud-app,mode=max

      - name: Export image tarball
        run: |
          set -euo pipefail
          name="weknora-app-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
          docker save "wechatopenai/weknora-app:cloud-${{ steps.v.outputs.short }}" | gzip -1 > "$name"
          sha256sum "$name" > SHA256SUMS-app.txt
          {
            echo "source_repo: ${{ inputs.source_repo || github.repository }}"
            echo "source_ref_requested: ${{ inputs.source_ref || github.sha }}"
            echo "resolved_sha: ${{ steps.v.outputs.full }}"
            echo "image_tag: wechatopenai/weknora-app:cloud-${{ steps.v.outputs.short }}"
            echo "with_anydoc: ${{ inputs.with_anydoc || '1' }}"
            echo "built_at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > MANIFEST-app.txt
          ls -lh "$name"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || 'cloud-images' }}"
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber \
            "weknora-app-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz" SHA256SUMS-app.txt MANIFEST-app.txt
          {
            echo "### app image"
            echo "- tag: wechatopenai/weknora-app:cloud-${{ steps.v.outputs.short }}"
            echo "- direct: https://github.com/${{ github.repository }}/releases/download/$tag/weknora-app-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
            echo "- via proxy: https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/$tag/weknora-app-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: ui image (linux/amd64)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ${{ inputs.source_repo || github.repository }}@${{ inputs.source_ref || github.sha }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve version info
        id: v
        run: |
          set -euo pipefail
          full="$(git rev-parse HEAD)"
          short="${full:0:7}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "resolved: $full (short $short)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ui image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: wechatopenai/weknora-ui:cloud-${{ steps.v.outputs.short }}
          build-args: |
            VITE_FRONTEND_COMMIT=${{ steps.v.outputs.short }}
          cache-from: type=gha,scope=cloud-ui
          cache-to: type=gha,scope=cloud-ui,mode=max

      - name: Export image tarball
        run: |
          set -euo pipefail
          name="weknora-ui-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
          docker save "wechatopenai/weknora-ui:cloud-${{ steps.v.outputs.short }}" | gzip -1 > "$name"
          sha256sum "$name" > SHA256SUMS-ui.txt
          {
            echo "source_repo: ${{ inputs.source_repo || github.repository }}"
            echo "source_ref_requested: ${{ inputs.source_ref || github.sha }}"
            echo "resolved_sha: ${{ steps.v.outputs.full }}"
            echo "image_tag: wechatopenai/weknora-ui:cloud-${{ steps.v.outputs.short }}"
            echo "built_at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > MANIFEST-ui.txt
          ls -lh "$name"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || 'cloud-images' }}"
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber \
            "weknora-ui-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz" SHA256SUMS-ui.txt MANIFEST-ui.txt
          {
            echo "### ui image"
            echo "- tag: wechatopenai/weknora-ui:cloud-${{ steps.v.outputs.short }}"
            echo "- direct: https://github.com/${{ github.repository }}/releases/download/$tag/weknora-ui-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
            echo "- via proxy: https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/$tag/weknora-ui-cloud-${{ steps.v.outputs.short }}-amd64.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"
